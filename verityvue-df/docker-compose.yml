services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis
  worker:
    build: ./backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A app.agent.celery_app.celery worker --loglevel=INFO
    depends_on:
      - redis
  frontend:
    build: ./frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  postgres:
    image: postgres:15-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: verity
      POSTGRES_PASSWORD: verity
      POSTGRES_DB: verityvue
    ports:
      - "5432:5432"
